<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zeigerketten-Spirograph</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14141f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14141f;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Tablet: kein versehentliches Markieren, kein Doppeltipp-Zoom */
  button, label, .block-titel, .staebe-label, #stab-anzahl, .farbwahl-kopf span,
  #ziffernfeld, #ziffernfeld span, #hinweis {
    -webkit-user-select: none;
    user-select: none;
  }

  button {
    touch-action: manipulation;
  }

  #app {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row;
  }

  #bühne {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    position: relative;
  }

  #zeichenflaeche {
    display: block;
    width: 100%;
    height: 100%;
  }

  #leiste {
    /* Zeichenfläche möglichst quadratisch: Die Leiste bekommt den Rest
       (Breite minus Höhe), mindestens 340 px, höchstens 480 px. */
    flex: 0 0 clamp(340px, calc(100vw - 100vh), 480px);
    width: clamp(340px, calc(100vw - 100vh), 480px);
    max-width: clamp(340px, calc(100vw - 100vh), 480px);
    min-height: 0;
    background: #1f1f30;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  #stab-liste {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: #4a4a6a #1f1f30;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #stab-liste::-webkit-scrollbar {
    width: 8px;
  }

  #stab-liste::-webkit-scrollbar-track {
    background: #1f1f30;
  }

  #stab-liste::-webkit-scrollbar-thumb {
    background: #4a4a6a;
    border-radius: 4px;
  }

  #aktionen {
    flex: 0 0 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    overflow-x: hidden;
    border-top: 1px solid #333345;
  }

  .knopf-zeile {
    display: flex;
    gap: 10px;
  }

  .block {
    background: #272740;
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .titel-zeile {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .block-titel {
    color: var(--lesefarbe);
    font-size: 17px;
    font-weight: bold;
    margin: 0;
    flex: 0 1 auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kopf-knoepfe {
    display: flex;
    flex: 0 0 auto;
    gap: 8px;
  }

  .regler-zeile {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .regler-zeile label {
    color: #ddd;
    font-size: 15px;
    width: 58px;
    flex: 0 0 58px;
  }

  #gesamt-tempo-zeile label {
    width: 112px;
    flex: none;
    font-weight: bold;
  }

  input[type="range"] {
    flex: 1 1 auto;
    height: 48px;
    width: 100%;
    min-width: 0;
  }

  /* Zahl neben dem Regler: sieht aus wie ein Knopf (ist keine Eingabe) */
  .zahl-knopf {
    flex: none;
    width: 56px;
    min-height: 48px;
    padding: 0;
    font-size: 20px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: #fff;
    background: #1a1a2c;
    border: 2px solid #5a5a80;
    border-radius: 10px;
    cursor: pointer;
  }

  .zahl-knopf:active {
    background: #4a4a6a;
  }

  .richtung-knopf {
    flex: none;
    width: 52px;
    min-height: 48px;
    font-size: 22px;
    font-weight: bold;
    border-radius: 10px;
    border: 2px solid var(--lesefarbe);
    background: transparent;
    color: var(--lesefarbe);
    cursor: pointer;
  }

  .spur-knopf {
    flex: none;
    width: 76px;
    min-height: 48px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 10px;
    border: 2px solid var(--lesefarbe);
    background: transparent;
    color: var(--lesefarbe);
    cursor: pointer;
  }

  .spur-knopf.an {
    background: var(--farbe);
    color: var(--spur-text);
  }

  .farb-knopf {
    flex: none;
    width: 48px;
    min-height: 48px;
    border-radius: 10px;
    border: 3px solid #fff;
    background: var(--farbe);
    padding: 0;
    cursor: pointer;
  }

  .staebe-zeile {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .staebe-zeile .staebe-label {
    color: #ddd;
    font-size: 15px;
    font-weight: bold;
    flex: none;
    width: 58px;
  }

  #stab-minus, #stab-plus {
    flex: 1 1 0;
    min-height: 48px;
    font-size: 26px;
    font-weight: bold;
    background: #3a3a55;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  #stab-minus:disabled, #stab-plus:disabled {
    opacity: 0.35;
    cursor: default;
  }

  #stab-anzahl {
    flex: none;
    width: 34px;
    text-align: center;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
  }

  #start-pause, #loeschen {
    flex: 1 1 0;
    min-height: 56px;
    font-size: 22px;
    background: #3a3a55;
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }

  #start-pause { font-size: 32px; }

  #start-pause:active, #loeschen:active,
  #stab-minus:active:not(:disabled), #stab-plus:active:not(:disabled) {
    background: #4a4a6a;
  }

  #farbwahl {
    position: absolute;
    top: 16px;
    right: 16px;
    max-width: calc(100% - 32px);
    background: #22223a;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 50;
    touch-action: none;
    box-sizing: border-box;
  }

  #farbwahl[hidden] {
    display: none;
  }

  .farbwahl-kopf {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .farbwahl-kopf span {
    color: #fff;
    font-size: 16px;
    font-weight: bold;
  }

  #farbwahl-schliessen {
    flex: none;
    width: 48px;
    min-height: 48px;
    font-size: 22px;
    font-weight: bold;
    background: #3a3a55;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  #farbwahl-schliessen:active {
    background: #4a4a6a;
  }

  .farbwahl-inhalt {
    display: flex;
    gap: 10px;
  }

  #farbfeld-canvas {
    border-radius: 8px;
    touch-action: none;
    cursor: crosshair;
    display: block;
  }

  #helligkeit-canvas {
    border-radius: 8px;
    touch-action: none;
    cursor: pointer;
    display: block;
  }

  /* Ziffernfeld: eigene Zifferntasten über der Zeichenfläche */
  #ziffernfeld {
    position: absolute;
    top: 16px;
    right: 16px;
    max-width: calc(100% - 32px);
    max-height: calc(100% - 32px);
    overflow-y: auto;
    background: #22223a;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 55;
    touch-action: manipulation;
  }

  #ziffernfeld[hidden] {
    display: none;
  }

  #ziffernfeld-titel {
    display: block;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  #ziffernfeld-anzeige {
    display: block;
    min-height: 56px;
    line-height: 56px;
    margin-bottom: 10px;
    padding: 0 14px;
    text-align: right;
    font-size: 40px;
    font-weight: bold;
    color: #fff;
    background: #14141f;
    border-radius: 10px;
  }

  #ziffernfeld-tasten {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-auto-rows: 64px;
    gap: 8px;
  }

  #ziffernfeld-tasten button {
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    background: #3a3a55;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  #ziffernfeld-tasten button:active {
    background: #4a4a6a;
  }

  #ziffernfeld-tasten button[data-taste="ok"] {
    background: #2e7d32;
    font-size: 24px;
  }

  /* Zeile mit Speichern / Muster / Bild: Symbol oben, kurzes Wort darunter */
  .aktion-knopf {
    flex: 1 1 0;
    min-width: 0;
    min-height: 56px;
    padding: 4px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: #3a3a55;
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }

  .aktion-knopf .sym {
    font-size: 22px;
    line-height: 26px;
  }

  .aktion-knopf .wort {
    font-size: 14px;
    font-weight: bold;
    line-height: 18px;
    white-space: nowrap;
  }

  .aktion-knopf:active:not(:disabled) {
    background: #4a4a6a;
  }

  .aktion-knopf:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* Bibliothek "Meine Muster": großes Fenster über der Zeichenfläche */
  #bibliothek {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    background: #22223a;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 58;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  #bibliothek[hidden] {
    display: none;
  }

  .bib-kopf {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  #bib-titel {
    color: #fff;
    font-size: 22px;
    font-weight: bold;
  }

  #bib-schliessen {
    flex: none;
    width: 56px;
    min-height: 56px;
    font-size: 26px;
    font-weight: bold;
    background: #3a3a55;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  #bib-schliessen:active {
    background: #4a4a6a;
  }

  #bib-inhalt {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    touch-action: pan-y;
    scrollbar-width: thin;
    scrollbar-color: #4a4a6a #22223a;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    grid-auto-rows: min-content;
    gap: 12px;
    align-content: start;
  }

  #bib-leer {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px 0;
    color: #fff;
  }

  #bib-leer .gross {
    font-size: 72px;
    line-height: 1.1;
  }

  #bib-leer .text {
    font-size: 24px;
    font-weight: bold;
  }

  .kachel {
    position: relative;
    min-width: 0;
    background: #14141f;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
  }

  .kachel img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #14141f;
    -webkit-user-drag: none;
  }

  .kachel-datum {
    padding: 4px 8px 6px 8px;
    color: #bbb;
    font-size: 13px;
    text-align: center;
  }

  .kachel-loeschen {
    position: absolute;
    top: 0;
    right: 0;
    width: 48px;
    height: 48px;
    font-size: 20px;
    font-weight: bold;
    background: rgba(20, 20, 31, 0.7);
    color: #fff;
    border: none;
    border-radius: 0 12px 0 12px;
    cursor: pointer;
  }

  .kachel-frage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
    background: rgba(20, 20, 31, 0.94);
    cursor: default;
  }

  .kachel-frage .text {
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
  }

  .kachel-frage .tasten {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .kachel-frage button {
    flex: 1 1 0;
    min-width: 0;
    min-height: 48px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: #3a3a55;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .kachel-frage button.ja {
    background: #b3261e;
  }

  /* Kurzer Hinweis ("✓ Gespeichert") */
  #hinweis {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 12px 22px;
    background: rgba(34, 34, 58, 0.96);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    z-index: 70;
  }

  #hinweis[hidden] {
    display: none;
  }

  /* Notbremse: großes Fenster über der Zeichenfläche */
  #notbremse {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(20, 20, 31, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    touch-action: manipulation;
  }

  #notbremse[hidden] {
    display: none;
  }

  .notbremse-karte {
    width: 320px;
    max-width: calc(100% - 32px);
    background: #22223a;
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  .notbremse-symbol {
    color: #fff;
    font-size: 64px;
    text-align: center;
    line-height: 1.1;
    -webkit-user-select: none;
    user-select: none;
  }

  .notbremse-text {
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin: 0 0 6px 0;
    -webkit-user-select: none;
    user-select: none;
  }

  #notbremse-weiter, #notbremse-loeschen {
    width: 100%;
    min-height: 56px;
    font-size: 20px;
    background: #3a3a55;
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }

  #notbremse-weiter { font-size: 24px; font-weight: bold; }

  #notbremse-weiter:active, #notbremse-loeschen:active {
    background: #4a4a6a;
  }

  /* Versteckte Messanzeige (nur mit ?fps in der Adresse) */
  #messanzeige {
    position: absolute;
    left: 6px;
    bottom: 6px;
    max-width: calc(100% - 12px);
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.6);
    color: #9f9;
    font: 12px monospace;
    border-radius: 6px;
    pointer-events: none;
    z-index: 40;
  }

  @media (orientation: portrait) {
    #app {
      flex-direction: column;
    }
    #bühne {
      flex: 1 1 auto;
      min-height: 120px;
    }
    #leiste {
      flex: 0 0 auto;
      width: 100%;
      max-width: 100%;
      max-height: 45vh;
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="bühne">
    <canvas id="zeichenflaeche"></canvas>
    <div id="farbwahl" hidden>
      <div class="farbwahl-kopf">
        <span id="farbwahl-titel">Farbe</span>
        <button id="farbwahl-schliessen">✕</button>
      </div>
      <div class="farbwahl-inhalt">
        <canvas id="farbfeld-canvas" width="280" height="200"></canvas>
        <canvas id="helligkeit-canvas" width="48" height="200"></canvas>
      </div>
    </div>
    <div id="ziffernfeld" hidden>
      <span id="ziffernfeld-titel"></span>
      <span id="ziffernfeld-anzeige"></span>
      <div id="ziffernfeld-tasten">
        <button data-taste="1">1</button>
        <button data-taste="2">2</button>
        <button data-taste="3">3</button>
        <button data-taste="4">4</button>
        <button data-taste="5">5</button>
        <button data-taste="6">6</button>
        <button data-taste="7">7</button>
        <button data-taste="8">8</button>
        <button data-taste="9">9</button>
        <button data-taste="weg">⌫</button>
        <button data-taste="0">0</button>
        <button data-taste="ok">OK</button>
      </div>
    </div>
    <div id="bibliothek" hidden>
      <div class="bib-kopf">
        <span id="bib-titel">Meine Muster</span>
        <button id="bib-schliessen">✕</button>
      </div>
      <div id="bib-inhalt"></div>
    </div>
    <div id="hinweis" hidden></div>
    <div id="notbremse" hidden>
      <div class="notbremse-karte">
        <div class="notbremse-symbol">⏸</div>
        <p class="notbremse-text">Puh, zu viel!</p>
        <button id="notbremse-weiter">Weiter</button>
        <button id="notbremse-loeschen">Spuren löschen und weiter</button>
      </div>
    </div>
  </div>
  <div id="leiste">
    <div id="stab-liste"></div>
    <div id="aktionen">
      <div class="regler-zeile" id="gesamt-tempo-zeile">
        <label for="gesamt-tempo">Gesamt-Tempo</label>
        <input type="range" id="gesamt-tempo" min="0" max="100" value="25">
        <button class="zahl-knopf" id="gesamt-tempo-zahl">25</button>
      </div>
      <div class="staebe-zeile">
        <span class="staebe-label">Stäbe</span>
        <button id="stab-minus">−</button>
        <span id="stab-anzahl">2</span>
        <button id="stab-plus">+</button>
      </div>
      <div class="knopf-zeile">
        <button id="start-pause">⏸</button>
        <button id="loeschen">Löschen</button>
      </div>
      <div class="knopf-zeile">
        <button class="aktion-knopf" id="speichern" disabled><span class="sym">💾</span><span class="wort">Speichern</span></button>
        <button class="aktion-knopf" id="muster" disabled><span class="sym">📚</span><span class="wort">Muster</span></button>
        <button class="aktion-knopf" id="bild-export" disabled><span class="sym">🖼</span><span class="wort">Bild</span></button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
// Service Worker für den Offline-Betrieb anmelden. Klappt nur über einen
// Server (http/https), nicht beim Öffnen der Datei per Doppelklick.
(function () {
  if (!("serviceWorker" in navigator)) {
    return;
  }
  if (location.protocol !== "http:" && location.protocol !== "https:") {
    return;
  }
  try {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  } catch (e) {
    // Ohne Service Worker läuft das Programm trotzdem normal.
  }
})();
</script>
</body>
</html>
